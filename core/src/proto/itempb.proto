syntax = "proto3";

package gamepb.itempb;

import "corepb.proto";
import "plantpb.proto";

// ============ 背包/仓库 ============

// 获取背包
message BagRequest {}

message BagReply {
    corepb.ItemBag item_bag = 1;  // 与 game 一致，背包数据在 item_bag 里
}

// ============ 出售物品 ============

message SellRequest {
    repeated corepb.Item items = 1;  // 要出售的物品列表 (id + count)
}

message SellReply {
    repeated corepb.Item sell_items = 1;  // 出售的物品
    repeated corepb.Item get_items = 2;   // 获得的物品（常见: 1001=金币, 1002=点券）
}

// ============ 使用物品 ============

message UseRequest {
    corepb.Item item = 1;
    UseTarget target = 2;
}

message UseTarget {
    int64 host_gid = 1;
    repeated int64 land_ids = 2 [packed = true];
    int64 use_config_id = 3;
}

message UseReply {
    repeated corepb.Item used_items = 1;
    repeated corepb.Item items = 2;
    repeated corepb.Item compensated_items = 3;
    gamepb.plantpb.LandInfo land = 4;
    UseLandReward land_reward = 5;
    UseSocialReward social_reward = 6;
    RandomPackUseRsp random_pack = 100;
}

message RandomPackUseRsp {
    repeated RandomPackStatus packs = 1;
}

message RandomPackStatus {
    int64 item_id = 1;
    repeated RandomPackGroupStatus groups = 2;
}

message RandomPackGroupStatus {
    int32 remaining_item_count = 1;
}

message UseLandReward {
    int64 land_id = 1;
    repeated corepb.Item items = 2;
}

// 青蛙使坏瓶等整座好友农场道具的奖励回包。
message UseSocialReward {
    int64 item_id = 1;
    repeated corepb.Item items = 2;
}

// ============ 批量使用物品 ============

// 2026-11-16 实包勘误：f1 是 varint 物品 ID，不是嵌套 Item——
// 旧定义 repeated Item items=1 在真实帧上解码直接越界报错。
// 实测帧（牧场草料补给）：BatchUse{80031(10小时有机罐头), 60}
//   → reply.gained{7004(牧草), 216000}，即 1 罐头 = 3600 牧草。
message BatchUseRequest {
    uint32 item_id = 1;
    uint32 count = 2;
    uint64 unknown_6 = 6;   // 实测 62478，语义未知
}

message BatchUseEntry {
    uint32 item_id = 1;
    uint64 count = 2;
    sint64 unknown_3 = 3;   // 实测 -62135596800（恰为 .NET 纪元偏移），语义未知
}

message BatchUseReply {
    BatchUseEntry used = 1;   // 回显本次使用的物品与数量
    BatchUseEntry gained = 2; // 使用后获得的物品（罐头→牧草即在此处）
}

// ============ 取消"新"标记 ============

message CannelNewRequest {
    repeated corepb.Item items = 1;
}

message CannelNewReply {}

// ============ 锁定/解锁物品 ============

message LockItemsRequest {
    repeated int64 item_uids = 1 [packed = true];
}

message LockItemsReply {
    repeated int64 item_uids = 1 [packed = true];
}

message UnlockItemsRequest {
    repeated int64 item_uids = 1 [packed = true];
}

message UnlockItemsReply {
    repeated int64 item_uids = 1 [packed = true];
}
