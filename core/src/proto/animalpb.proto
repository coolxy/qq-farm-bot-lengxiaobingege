syntax = "proto3";

package gamepb.animalpb;

// ============ 牧场（内测，2026-11-16 抓包实测）============
// 数据来源：微信端牧场真实 WS 帧（tools/extract-har-frames.js 拆帧 +
// decode-latest-protocols.js 解密解码）。字段号全部来自线上回包，字段名与
// mcboot 分包静态分析（Otherworldy/qq-farm，同日）交叉验证一致。
// 带 unknown_ 前缀的字段表示线上出现过但语义未确认，禁止按猜测的语义使用。

// 牧草库存（RanchInfo.f5 / FacilityDetail.f21）
message Grass {
    int64 amount = 1;        // 当前牧草数（实测 99/100）
    int64 unknown_2 = 2;     // 实测 54，语义未确认
    int64 empty_at_ms = 4;   // 耗尽墙钟；实测 u64max 表示不会耗尽
    int32 unknown_7 = 7;     // 实测 1
    int32 unknown_8 = 8;     // 实测 3
}

// 售价期望（AnimalInst.f22/f24、ShelfLot.f100.f4）
message ExpectedSell {
    int64 item_id = 1;       // 实测 1007（金币）
    int64 num = 2;           // 实测 2160 / 1620
}

// 动物变异（AnimalInst.f30；本次抓包仅出现 f8）
message AnimalMutation {
    int32 mutation_type = 1;
    int32 source = 2;
    int32 weight_display_x10 = 3;
    int32 scale_bp = 4;
    int32 weight_final_x10 = 5;
    int32 tier = 6;
    int64 became_at_ms = 7;
    int32 strokable = 8;     // 实测 1
    repeated int64 stroked_gids = 9;
}

// 单只动物（GetRanchDetail / FeedAnimal / HarvestRanch 回包）
message AnimalInst {
    int64 ranch_inst_id = 1;             // 实测 10001
    int32 slot_index = 2;                // 实测 1/2/3
    int64 animal_inst_id = 3;            // 实测 4/5/6
    int64 animal_id = 4;                 // 实测 60002
    int32 stage = 5;                     // 随时间推进，实测 2→5
    int32 produce_count = 6;             // 收获后实测 2
    int64 grow_ready_at_ms = 10;         // 成长就绪墙钟
    int64 infant_ready_at_ms = 14;       // 幼崽期结束墙钟
    int32 can_feed = 18;                 // 实测 1=可喂
    int32 limited_can_used = 19;         // 实测 1
    int32 can_donate = 20;               // 实测 1
    int64 expected_harvest_exp = 21;     // 实测 360
    ExpectedSell expected_harvest_sells = 22;
    int64 expected_produce_exp = 23;     // 实测 180
    ExpectedSell expected_produce_sells = 24;
    int64 mature_ready_at_ms = 25;       // 成年墙钟
    AnimalMutation mutation = 30;
}

// 货架上的产物批（Shelf.f10）
message ShelfLot {
    int64 item_id = 1;       // 实测 2060002（动物产物）/ 1102
    int64 num = 2;           // 实测 1 / 360
    ShelfLotExtra extra = 100;  // 字段号 100，线上实测存在
}

message ShelfLotExtra {
    ExpectedSell sell = 4;   // 实测 {1007, 2160}
}

// 货架（HarvestRanch 回包 f5）。
// 注意：mcboot 静态分析稿给的是 {slot, lots, total_remain, can_collect, can_steal}，
// 1.17.0.3 实包是 {ranch, slot, animal, lots}，以实包为准，不要照抄旧稿。
message Shelf {
    int64 ranch_inst_id = 1;     // 实测 10001
    int32 slot_index = 2;        // 实测 1
    int64 animal_inst_id = 3;    // 实测 4/5/6
    repeated ShelfLot lots = 10;
}

// 牧场主体（GetRanchDetail / FeedAnimal / HarvestRanch 回包 f1）
message RanchInfo {
    int64 ranch_inst_id = 1;     // 实测 10001
    int32 capacity = 2;          // 实测 3/4
    int32 animal_count = 3;      // 实测 3/4
    repeated AnimalInst animals = 4;
    Grass grass = 5;
    int32 husbandry_type = 6;    // 实测 1
    RanchExtras extras = 8;      // 实测 08031802，仅登录快照出现，语义未确认
}

// RanchInfo.f8 实测子消息：{f1:3, f3:2}，仅 PlayerLogin 后的首帧快照出现。
message RanchExtras {
    int32 unknown_1 = 1;         // 实测 3
    int32 unknown_3 = 3;         // 实测 2
}

// 操作配额（RanchService.GetRanchOpTimes 回包 f1）
message OpQuota {
    int64 op_id = 1;             // 实测 11003/11008/11009
    int32 times_limit = 2;       // 实测 100/20/10
    int32 used_times = 3;
    int32 remaining_times = 4;   // 实测与上限相同
}

// ============ 请求 / 回包 ============

message RanchRef {
    int64 ranch_inst_id = 1;     // 实测 10001
}

message GetRanchDetailRequest {
    // 2026-11-16 抓包解密实测：访问好友牧场时 f1 = 好友 gid（08 + gid），f2 空消息；
    // 看自己牧场时只发 f2 空消息（1200）。旧实现从不带 f1，导致好友牧场一直读回自己的数据。
    int64 unknown_1 = 1;         // 目标牧场主人 gid（自己牧场留空/0）
    bytes unknown_2 = 2;         // 实测空消息
}

message GetRanchDetailReply {
    RanchInfo ranch = 1;
}

message FeedAnimalRequest {
    RanchRef ranch = 1;          // 实测 {10001}
    int32 feed_type = 2;         // 实测 1
}

message FeedAnimalReply {
    RanchInfo ranch = 1;
}

// 2026-11-16 16:57 实包勘误：HarvestRanch 请求 f2 是「空消息」(1200)，不填 ranch_inst_id。
// 旧实现把 ranch_inst_id 塞进 f2 发出 (120308914e1801)，服务器多次回「网络繁忙」。
// 正确请求 = 12001801：f2 空 bytes、f3=1。收获目标由当前登录态决定。
message HarvestRanchRequest {
    bytes unknown_2 = 2;         // 实测空消息，不要填 ranch_inst_id
    int32 harvest_type = 3;      // 实测 1
}

message HarvestRanchReply {
    RanchInfo ranch = 1;
    repeated Shelf shelves = 5;
}

// 一键催产/互动（2026-11-16 第三段抓包实测）：请求体为空，对当前牧场全部
// 就绪动物触发产出；回包返回最新 RanchInfo（动物 f19 置 1、货架出现新产物批，
// 货架挂在 f3 而非 HarvestRanch 的 f5）。
message TriggerProduceRequest {}

message TriggerProduceReply {
    RanchInfo ranch = 1;
    repeated Shelf shelves = 3;
}

// 2026-11-16 16:57 实包：请求 0a00（f1 空消息）。空 body 在部分网关会被判参数错误。
message GetRanchOpTimesRequest {
    bytes unknown_1 = 1;         // 实测空消息
}

message GetRanchOpTimesReply {
    repeated OpQuota quotas = 1;
}

// 抚摸动物（RanchService.StrokeAnimal，2026-11-16 实测）。
// 请求 f1=主人 gid；f2=AnimalRef{ranch_inst_id, animal_inst_id}。
// 回包是最新 RanchInfo（animal.mutation.strokable/stroked_gids 会更新）。
message AnimalRef {
    int64 ranch_inst_id = 1;       // 实测 10001
    int64 animal_inst_id = 2;      // 实测 46/33（动物实例 id，不是 animal_id）
}

message StrokeAnimalRequest {
    int64 owner_gid = 1;           // 实测 1215360471（自己/好友 gid）
    AnimalRef animal = 2;
}

message StrokeAnimalReply {
    RanchInfo ranch = 1;
}

// 清理灾害（RanchService.PutHazard，2026-11-16 实测）。
// 请求 f1=ranch、f2=操作者 gid、f3=op_id(11003)、f4=1。
// 回包 f1=结果码(1)、f2=当日剩余可清理数(99→97)、f3=清理记录、
//       f4=奖励 corepb.Item{1102(点券), 5}（每条 5 点券）。
message HazardRecord {
    int32 unknown_1 = 1;           // 实测 2/3/4
    int64 at_sec = 2;              // 实测 1235782852（墙钟秒）
    int32 unknown_3 = 3;           // 实测 1
}

message HazardReward {
    int64 item_id = 1;             // 实测 1102（点券）
    int64 num = 2;                 // 实测 5
    bytes unknown_100 = 100;
}

message PutHazardRequest {
    int64 ranch_inst_id = 1;       // 实测 10001
    int64 operator_gid = 2;        // 实测 1220383670
    int64 op_id = 3;               // 实测 11003
    int32 unknown_4 = 4;           // 实测 1
}

message PutHazardReply {
    int32 result = 1;              // 实测 1
    int32 remaining = 2;           // 实测 99/98/97（当日剩余）
    repeated HazardRecord records = 3;
    HazardReward reward = 4;
}

// 一键清理牧场（RanchService.CleanAllRanch，2026-11-16 16:57 实包）。
// 请求 1200（f2 空消息，与 GetRanchDetail 一致）；回包 f1 是清理后的最新 RanchInfo。
// 线上实测：无蚊子/便便时服务器回业务错误 1045233「这里没有需要清理的蚊子或便便」，
// 说明该 RPC 的用途是一次性清完牧场里的蚊子与便便（与 PutHazard 的「清灾害」是不同玩法）。
// 抓包中买了 4 只幼崽后调用，回包动物 stage/状态不变，extras(f8) 被清空。
message CleanAllRanchRequest {
    bytes unknown_2 = 2;           // 实测空消息
}

message CleanAllRanchReply {
    RanchInfo ranch = 1;
}

service AnimalService {
    rpc GetRanchDetail(GetRanchDetailRequest) returns (GetRanchDetailReply);
    rpc FeedAnimal(FeedAnimalRequest) returns (FeedAnimalReply);
    rpc HarvestRanch(HarvestRanchRequest) returns (HarvestRanchReply);
    rpc TriggerProduce(TriggerProduceRequest) returns (TriggerProduceReply);
    rpc StrokeAnimal(StrokeAnimalRequest) returns (StrokeAnimalReply);
}

service RanchService {
    rpc GetRanchOpTimes(GetRanchOpTimesRequest) returns (GetRanchOpTimesReply);
    rpc PutHazard(PutHazardRequest) returns (PutHazardReply);
    rpc CleanAllRanch(CleanAllRanchRequest) returns (CleanAllRanchReply);
}
